services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-postgres}?schema=public"
      UPLOAD_DIR: /usr/src/app/uploads
      DOCUMENTOS_DIR: /usr/src/app/documentos-privados
    volumes:
      - uploads:/usr/src/app/uploads
      # Os ficheiros dos documentos à venda: sem volume, perdiam-se a cada novo build.
      - documentos-privados:/usr/src/app/documentos-privados
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Só na própria VPS: o Docker passa à frente do firewall e abriria a base à internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  uploads:
  documentos-privados:
  pgdata: